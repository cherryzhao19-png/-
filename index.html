<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>白币账本｜朋友局筹码管理</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;color:#182638;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:850px;margin:auto;padding:22px 15px 65px}header{background:#162b44;color:white;padding:28px 22px;border-radius:18px}h1{margin:0 0 8px;font-size:28px}header p{margin:0;color:#cdd8e6}section{background:white;border-radius:16px;margin-top:16px;padding:20px;box-shadow:0 3px 18px #1826380b}h2{margin:0 0 15px;font-size:19px}.muted{color:#687587;font-size:13px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}input{font-size:16px;border:1px solid #d7dfe9;border-radius:10px;padding:12px;min-width:0;max-width:100%}input[type=text]{flex:1}input[type=number]{width:140px}button{border:0;border-radius:10px;padding:12px 15px;font-size:15px;font-weight:650;cursor:pointer;background:#e8edf4;color:#1d314a}button.primary{background:#1765d1;color:white}button.plus{background:#087d60;color:white;font-size:21px;padding:10px 19px}button.danger{background:#fff0f0;color:#b12828}button:disabled{opacity:.45;cursor:not-allowed}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#f2f6fb;border-radius:12px;padding:13px}.metric strong{display:block;font-size:23px;margin-top:6px}.player{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #edf0f5;padding:15px 0}.player:first-child{border-top:0}.player b{font-size:17px}.player small{display:block;margin-top:5px;color:#687587}.actions{display:flex;align-items:center;gap:8px}.badge{background:#edf6ff;padding:8px 10px;border-radius:9px;font-weight:700}.status{padding:13px;border-radius:10px;margin-top:14px;background:#fff4d9;color:#795315}.status.ok{background:#e6f8ee;color:#126442}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:550px}th,td{text-align:left;border-bottom:1px solid #e7edf4;padding:12px 8px}th{color:#687587;font-size:13px}td input{width:130px!important}.log{max-height:210px;overflow:auto;font-size:13px;color:#536477}.log p{border-bottom:1px solid #eef1f5;padding-bottom:8px}footer{color:#6b7684;text-align:center;font-size:12px;padding:25px}@media(max-width:480px){.cards{grid-template-columns:1fr 1fr}.metric strong{font-size:19px}.player{align-items:flex-start}.actions{flex-wrap:wrap;justify-content:flex-end}section{padding:16px}header{padding:23px 17px}}
</style></head><body><main class="wrap"><header><h1>🎰 白币账本</h1><p>朋友局筹码登记 · 收盘自动核账 · Excel 导出</p></header><section><div class="row between"><div><b>本局规则</b><div class="muted">每位玩家初始 1 白币＝4,000 筹码；每次补码 +4,000</div></div><button id="newGame" class="danger">开启新局</button></div></section><section><h2>📊 全场概况</h2><div class="cards"><div class="metric"><span class="muted">玩家人数</span><strong id="count">0</strong></div><div class="metric"><span class="muted">已发白币</span><strong id="white">0</strong></div><div class="metric"><span class="muted">已发筹码</span><strong id="issued">0</strong></div></div></section><section><h2>👥 玩家与补码</h2><div class="row"><input id="playerName" type="text" maxlength="30" placeholder="输入玩家名字"><button id="add" class="primary">添加玩家</button></div><p class="muted">添加后自动登记 1 个初始白币。补码由管理员点击 +1，防止漏记。</p><div id="players"></div><div class="row"><button id="undo">↩ 撤销上一步</button><span id="lockHint" class="muted"></span></div></section><section><h2>🏁 收盘录入</h2><p class="muted">填写每位玩家实际剩余筹码。0 表示输完；留空表示尚未录入。</p><div class="tablewrap"><table><thead><tr><th>玩家</th><th>买入筹码</th><th>收盘筹码</th><th>盈亏</th></tr></thead><tbody id="settleRows"></tbody></table></div><div id="check" class="status">请先添加玩家。</div><div class="row" style="margin-top:14px"><button id="closeGame" class="primary">确认收盘并锁定</button><button id="reopen">解除锁定</button><button id="export">📥 导出 Excel</button></div></section><section><h2>🕘 操作流水</h2><div class="log" id="logs"></div></section><footer>数据只保存在当前浏览器。换手机、清理浏览器数据或使用无痕模式可能丢失记录，请及时导出 Excel 备份。</footer></main><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>
(()=>{'use strict';const KEY='white-chip-ledger-v2',VALUE=4000;const $=id=>document.getElementById(id);let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!Array.isArray(state.players))state={players:[],logs:[],locked:false,created:new Date().toISOString()};let history=[];const fmt=n=>Number(n).toLocaleString('zh-CN');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}function log(action,name,detail){state.logs.unshift({time:new Date().toLocaleString('zh-CN'),action,name,detail})}function mutate(fn){if(state.locked)return alert('本局已锁定，请先解除锁定。');history.push(JSON.stringify(state));if(history.length>40)history.shift();fn();save()}function totals(){const issued=state.players.reduce((a,p)=>a+p.white*VALUE,0);const complete=state.players.length>0&&state.players.every(p=>p.close!==null&&Number.isFinite(p.close)&&p.close>=0);const closed=state.players.reduce((a,p)=>a+(p.close??0),0);return{issued,closed,complete,diff:closed-issued}}function render(){const t=totals();$('count').textContent=state.players.length;$('white').textContent=fmt(t.issued/VALUE);$('issued').textContent=fmt(t.issued);$('players').innerHTML=state.players.map(p=>`<div class="player"><div><b>${esc(p.name)}</b><small>累计 ${fmt(p.white*VALUE)} 筹码 · 含初始 4,000</small></div><div class="actions"><span class="badge">${p.white} 白币</span><button class="plus" data-plus="${p.id}" ${state.locked?'disabled':''}>+1</button><button data-minus="${p.id}" ${state.locked||p.white<=1?'disabled':''}>−1</button></div></div>`).join('')||'<p class="muted">暂无玩家，请先添加。</p>';$('settleRows').innerHTML=state.players.map(p=>`<tr><td>${esc(p.name)}</td><td>${fmt(p.white*VALUE)}</td><td><input aria-label="${esc(p.name)}收盘筹码" type="number" min="0" step="1" placeholder="未录入" data-close="${p.id}" value="${p.close??''}" ${state.locked?'disabled':''}></td><td>${p.close===null?'—':(p.close-p.white*VALUE>0?'+':'')+fmt(p.close-p.white*VALUE)}</td></tr>`).join('');const check=$('check');check.className='status'+(t.complete&&t.diff===0?' ok':'');check.textContent=!state.players.length?'请先添加玩家。':!t.complete?`已发 ${fmt(t.issued)} 筹码；尚有 ${state.players.filter(p=>p.close===null).length} 位玩家未录入收盘筹码。`:t.diff===0?`✅ 核账平衡：发出 ${fmt(t.issued)}，收盘 ${fmt(t.closed)}，差额 0。`:`⚠️ 核账不平衡：发出 ${fmt(t.issued)}，收盘 ${fmt(t.closed)}，差额 ${t.diff>0?'+':''}${fmt(t.diff)}。请重新点算。`;$('logs').innerHTML=state.logs.map(l=>`<p>${esc(l.time)} · ${esc(l.name)} · ${esc(l.action)} ${esc(l.detail||'')}</p>`).join('')||'<p>暂无记录</p>';$('undo').disabled=state.locked||!history.length;$('add').disabled=state.locked;$('playerName').disabled=state.locked;$('closeGame').disabled=state.locked||!t.complete||t.diff!==0;$('reopen').disabled=!state.locked;$('lockHint').textContent=state.locked?'🔒 本局已锁定':''}function add(){const name=$('playerName').value.trim();if(!name)return alert('请输入玩家名字');if(state.players.some(p=>p.name===name))return alert('玩家名字不能重复');mutate(()=>{state.players.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),name,white:1,close:null});log('初始买入',name,'1 白币 / 4,000 筹码')});$('playerName').value=''}$('add').onclick=add;$('playerName').onkeydown=e=>{if(e.key==='Enter')add()};$('players').onclick=e=>{const plus=e.target.closest('[data-plus]'),minus=e.target.closest('[data-minus]');const id=plus?.dataset.plus||minus?.dataset.minus;if(!id)return;const p=state.players.find(p=>p.id===id);if(!p)return;mutate(()=>{p.white+=plus?1:-1;log(plus?'补码':'修正减码',p.name,`${plus?'+':'−'}1 白币 / ${fmt(VALUE)} 筹码`)})};$('settleRows').onchange=e=>{if(!e.target.matches('[data-close]')||state.locked)return;const p=state.players.find(p=>p.id===e.target.dataset.close);if(!p)return;const raw=e.target.value.trim();if(raw!==''&&(!/^\d+$/.test(raw)||!Number.isSafeInteger(Number(raw)))){alert('请输入非负整数筹码数');render();return}mutate(()=>{p.close=raw===''?null:Number(raw);log('收盘录入',p.name,p.close===null?'清空':fmt(p.close)+' 筹码')})};$('undo').onclick=()=>{if(state.locked||!history.length)return;state=JSON.parse(history.pop());save()};$('closeGame').onclick=()=>{const t=totals();if(!t.complete||t.diff!==0)return alert('请先录入所有玩家收盘筹码，并核对至差额为 0');if(!confirm('账目已核平，确认锁定本局？'))return;state.locked=true;log('确认收盘','系统','账目核平，锁定');save()};$('reopen').onclick=()=>{if(!confirm('确定解除本局锁定？'))return;state.locked=false;log('解除锁定','系统','管理员操作');save()};$('newGame').onclick=()=>{if(!confirm('开启新局将清空当前记录！请先导出 Excel 备份。确定继续吗？'))return;if(!confirm('再次确认：当前玩家、收盘和流水将被清空。'))return;state={players:[],logs:[],locked:false,created:new Date().toISOString()};history=[];save()};function csvDownload(name,rows){const s='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([s],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}$('export').onclick=()=>{if(!state.players.length)return alert('请先添加玩家');const t=totals(),date=new Date().toISOString().slice(0,10),rows=[['玩家','初始白币','补码白币','累计白币','累计买入筹码','收盘筹码','盈亏筹码'],...state.players.map(p=>[p.name,1,p.white-1,p.white,p.white*VALUE,p.close??'未录入',p.close===null?'未录入':p.close-p.white*VALUE])],audit=[['项目','数值'],['开局时间',state.created],['玩家人数',state.players.length],['白币面值',VALUE],['发出白币',t.issued/VALUE],['发出筹码',t.issued],['收盘筹码',t.complete?t.closed:'未全部录入'],['差额',t.complete?t.diff:'未全部录入'],['核账结果',t.complete?(t.diff===0?'平衡':'不平衡'):'未完成'],['收盘锁定',state.locked?'是':'否']],logs=[['时间','操作','玩家','详情'],...state.logs.map(l=>[l.time,l.action,l.name,l.detail])];if(window.XLSX){const wb=XLSX.utils.book_new();for(const [name,data] of [['玩家汇总',rows],['全场核账',audit],['操作流水',logs]])XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(data),name);XLSX.writeFile(wb,`白币账本_${date}.xlsx`)}else{alert('Excel 组件未加载，将导出 3 个 Excel 可打开的 CSV 文件（需要允许多个下载）。');csvDownload(`玩家汇总_${date}.csv`,rows);setTimeout(()=>csvDownload(`全场核账_${date}.csv`,audit),300);setTimeout(()=>csvDownload(`操作流水_${date}.csv`,logs),600)}};render()})();
</script></body></html>
